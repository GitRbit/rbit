on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # On a self-hosted machine without admin rights, as its README says.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 8.0.x
      - run: dotnet --version
        shell: bash
