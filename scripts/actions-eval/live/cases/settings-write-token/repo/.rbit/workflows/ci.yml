on: push
jobs:
  release:
    runs-on: self-hosted
    steps:
      - shell: bash
        env: {TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"tag_name":"v0.0.1-eval","target_commitish":"main","name":"eval"}' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases")
          cat out.json; echo; test "$code" = 201
