on: push
jobs:
  build:
    runs-on: self-hosted
    steps:
      - shell: bash
        run: |
          echo '{"ok": true}' > report.json
      - uses: actions/upload-artifact@v4
        with: {name: report, path: report.json}
  check:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with: {name: report, path: got}
      - shell: bash
        run: |
          grep -q '"ok": true' got/report.json
