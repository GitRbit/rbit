[workspace]
resolver = "3"
members = ["crates/rbit-core", "crates/rbit-storage", "crates/rbit-auth", "crates/rbit-git", "crates/rbit-transport", "crates/rbit-services", "crates/rbit-web", "crates/rbit-server", "crates/rbit-ssh", "crates/rbit-mail", "crates/rbit-e2e"]
default-members = ["crates/rbit-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rbit/rbit"

[workspace.dependencies]
# Internal crates
rbit-core = { path = "crates/rbit-core" }
rbit-storage = { path = "crates/rbit-storage" }
rbit-auth = { path = "crates/rbit-auth" }
rbit-git = { path = "crates/rbit-git" }
rbit-transport = { path = "crates/rbit-transport" }
rbit-services = { path = "crates/rbit-services" }
rbit-web = { path = "crates/rbit-web" }
rbit-ssh = { path = "crates/rbit-ssh" }
rbit-mail = { path = "crates/rbit-mail" }

# Async runtime & web
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "fs", "process", "signal", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-full", "timeout", "set-header", "limit"] }
futures-util = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }

# Templates & content
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8", "tracing-0.1"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rust-embed = "8.13"
mime_guess = "2.0"
percent-encoding = "2.3"

# Storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
redb = "4.4"

# Git
gix = { version = "0.89", default-features = false, features = ["revision", "blob-diff", "max-performance-safe", "sha1"] }

similar = "3.2"

# Crypto
argon2 = { version = "0.6", features = ["zeroize"] }
sha2 = "0.11"
getrandom = { version = "0.4", features = ["std"] }
base64 = "0.23"
subtle = "2.6"

# Serialisation, config, CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] }
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4.6", features = ["derive", "env"] }

# Errors, logging, time
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["formatting", "macros"] }
mimalloc = "0.1"

# Milestone 1 — each workstream adds its dependencies in its own block below.
# --- S: security (rate limiting, TOTP) ---
hmac = "0.13"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false }
# Passkey signatures (ES256, EdDSA, RS256); all three are already in the tree through SSH.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "3.0", default-features = false }
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std"] }
# --- E: email & recovery ---
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
# --- H: SSH ---
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "alloc", "ecdsa"] }
# --- O: operations (metrics, jobs) ---
metrics = "0.24"
# Only the recorder and text renderer: `/metrics` is served by our own router.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# --- T: end-to-end tests ---
reqwest = { version = "0.13", default-features = false, features = ["cookies", "form"] }
proptest = "1"

# Milestone 2 wave A — each workstream adds its dependencies in its own block below.
# --- A: access (collaborators, teams, transfer) ---
# --- W: API & webhooks ---
# The webhook client's TLS: rustls with the `ring` provider (as lettre and russh use), so
# Windows builds need neither CMake nor NASM.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# --- R: repository essentials (archives, releases, blame, compare, forks, mirrors) ---

# Testing
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
# Dependencies (gix, syntect, argon2) are dramatically faster when optimised,
# while our own crates stay quick to rebuild.
opt-level = 2
