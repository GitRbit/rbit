# Rustit configuration for a production instance.
#
# Copy to /etc/rustit/rustit.toml (the systemd unit's default) and adjust. Every key is
# optional; omitted keys keep their built-in defaults. Any key can also be set with an
# environment variable: RUSTIT_<SECTION>__<KEY>, e.g. RUSTIT_SERVER__PUBLIC_URL.
# Environment variables win over this file.

[server]
# Listen on loopback only and let the reverse proxy (Caddy, nginx) terminate TLS.
bind = "127.0.0.1:3000"
# The address users type. Used for clone URLs, secure cookies (https://…) and the
# cross-site request check, so it must match what the browser sees exactly.
public_url = "https://git.example.com"
site_name = "Rustit"
# Default for the runtime "registration" setting (administrators can change it in /admin).
open_registration = false

[storage]
# SQLite database, redb store and bare repositories all live here. Back it up with
# `rustit backup --output DIR` (see docs/deployment.md).
data_dir = "/var/lib/rustit"

[security]
session_lifetime_days = 30
min_password_length = 12
# Requests from these proxies may set X-Forwarded-For / X-Forwarded-Proto. List exactly
# the reverse proxy's address; anything broader lets clients spoof their IP address.
# trusted_proxies = ["127.0.0.1/32", "::1/128"]
# Throttle sign-in, sign-up, 2FA, Git credentials, email requests and form posts.
rate_limit = true

[repository]
default_branch = "main"
# The git executable used for smart HTTP, `git gc` and backups.
git_binary = "/usr/bin/git"
max_render_bytes = 1048576

[mail]
# "disabled" (password reset and verification explain that email is unavailable),
# "log" (development) or "smtp" (see the [mail] reference for the relay settings).
transport = "disabled"
# from_address = "git@example.com"
# from_name = ""                  # blank: the site name
# smtp_host = "smtp.example.com"
# smtp_port = 587                 # default 587 (starttls/none) or 465 (tls)
# smtp_security = "starttls"      # "starttls" (required), "tls" or "none"
# smtp_username = "rustit"
# smtp_password = "…"             # prefer RUSTIT_MAIL__SMTP_PASSWORD in the environment
# timeout_seconds = 30

[ssh]
# Built-in SSH server for git@… clone URLs.
enabled = false
bind = "0.0.0.0:2222"
# Host and port shown in clone URLs (port 22 gives git@host:owner/repo.git).
# public_host = "git.example.com"
# public_port = 22
# host_key_path = "/var/lib/rustit/ssh/host_ed25519"   # generated on first start
# max_connections = 256
# max_connections_per_ip = 16
# auth_timeout_seconds = 30
# idle_timeout_seconds = 300
# max_session_seconds = 3600

[operations]
# Prometheus metrics at /metrics. Keep the endpoint private: set a token, or block
# /metrics at the reverse proxy and scrape the loopback address directly.
metrics = false
# metrics_token = "replace-with-a-long-random-string"
# Warm language and last-commit caches right after each push.
warm_caches_on_push = true
# `git gc --auto` for repositories pushed to since the last run, then cache pruning.
# 0 disables periodic maintenance.
maintenance_interval_minutes = 360
# Background jobs (cache warming, git gc) running at the same time.
job_concurrency = 2
# Insights cache limits (redb). Pruned entries are recomputed on demand. 0 = no limit.
insights_cache_max_age_days = 30
insights_cache_max_entries = 50000
