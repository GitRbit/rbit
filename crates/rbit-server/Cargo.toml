[package]
name = "rbit-server"
description = "The `rbit` binary: a self-hosted Git platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rbit"
path = "src/main.rs"

[dependencies]
rbit-core.workspace = true
rbit-storage.workspace = true
rbit-services.workspace = true
rbit-web.workspace = true
rbit-ssh.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
figment.workspace = true
mimalloc.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rbit-git.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
# The command-line client: the REST API over HTTPS (ring-backed rustls, as the server's other
# clients), its logins in TOML, and artifacts unpacked from their tar.gz.
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
toml.workspace = true
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
rbit-services.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# L: Git LFS object ids in the backup test.
sha2.workspace = true

[lints]
workspace = true
