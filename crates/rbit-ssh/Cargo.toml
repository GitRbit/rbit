[package]
name = "rbit-ssh"
description = "Built-in SSH server for Git over SSH (russh)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# One integration-test binary (tests/main.rs) instead of one per file.
autotests = false

[dependencies]
rbit-core.workspace = true
rbit-services.workspace = true
rbit-transport.workspace = true
getrandom.workspace = true
russh.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# L: Git LFS (`git-lfs-authenticate` answers JSON).
serde_json.workspace = true

[dev-dependencies]
rbit-storage.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
