[package]
name = "rbit-services"
description = "Forge service composition and optional plugin activation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[features]
default = ["actions", "i18n"]
actions = ["dep:rbit-actions"]

i18n = ["dep:rbit-i18n"]

[dependencies]
getrandom.workspace = true
rbit-i18n = { workspace = true, optional = true }
rbit-messages.workspace = true
rbit-services-base.workspace = true
rbit-actions = { workspace = true, optional = true }
rbit-core.workspace = true
rbit-storage.workspace = true
rbit-plugin-api.workspace = true
rbit-plugin-runtime.workspace = true
tokio.workspace = true
semver.workspace = true
tracing.workspace = true

[dev-dependencies]
sha2.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest.workspace = true
tokio-util.workspace = true
ssh-key.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tempfile.workspace = true
sqlx.workspace = true
# A software authenticator for the passkey tests.
p256.workspace = true
base64.workspace = true
# M: a fake GitHub/Gitea server for the import tests.
axum.workspace = true
# Actions: reading the zip archives artifacts are served as.
zip.workspace = true

rbit-auth.workspace = true
rbit-git.workspace = true
rbit-mail.workspace = true
rbit-workflow.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
