{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}
<section class="flex flex-col items-center py-20 text-center sm:py-28">
  <p class="flex items-center gap-4 text-ink-muted">
    <span class="font-mono text-xl text-ink">{{ info.status.as_u16() }}</span>
    <span class="h-6 w-px bg-line-strong"></span>
    <span>{{ info.title }}</span>
  </p>
  <p class="mt-4 max-w-sm text-[13px] text-ink-muted">{{ info.message }}</p>
  <div class="mt-8 flex gap-2">
    <a href="/" class="btn btn-primary">Go home</a>
    <a href="/explore" class="btn">Explore</a>
  </div>
</section>
{% endblock %}
