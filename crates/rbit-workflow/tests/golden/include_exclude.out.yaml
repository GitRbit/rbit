name: Matrix with include and exclude
"on":
  push:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  test:
    name: test (macos, stable)
    runs-on:
      - self-hosted
      - macos
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos
        rust:
          - stable
    steps:
      - uses: actions/checkout@v4
      - run: cargo +${{ matrix.rust }} test
        env:
          RUST_BACKTRACE: 1
