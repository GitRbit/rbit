[package]
name = "rbit-storage"
description = "Persistence for rbit: SQLite for relational data, redb for sessions and caches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# One integration-test binary (tests/main.rs) instead of one per file.
autotests = false

[dependencies]
rbit-core.workspace = true
sqlx.workspace = true
redb.workspace = true
serde.workspace = true
# T0: timeline events are stored as JSON.
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Pool contention metrics (`sqlite::pool`); the web crate installs the recorder.
metrics.workspace = true
futures-util.workspace = true

[dev-dependencies]
metrics-exporter-prometheus.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
