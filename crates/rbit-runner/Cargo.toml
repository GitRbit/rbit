[package]
name = "rbit-runner"
description = "The `rbit-runner` binary: runs rbit Actions jobs in Docker or Podman containers or a host shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rbit-runner"
path = "src/main.rs"

[dependencies]
# The wire contract, shared with the server; the runner depends on no server crate.
rbit-workflow.workspace = true

# Masking: one automaton per task over every secret and its encodings.
aho-corasick.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
# The runner-local cache: tar archives, gzip-compressed.
flate2.workspace = true
# Idempotency keys and backoff jitter.
getrandom.workspace = true
# The protocol client: JSON over HTTPS with rustls and the `ring` provider (as the server's
# webhook client), so Windows builds need neither CMake nor NASM.
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# hashFiles.
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
# Cancellation that tasks, heartbeats and the poll loop share.
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` and `O_NONBLOCK` for files a container job can write (`untrusted`).
libc.workspace = true

[dev-dependencies]
# An in-process stand-in for the server's protocol endpoint.
axum.workspace = true
tempfile.workspace = true

[lints]
workspace = true
