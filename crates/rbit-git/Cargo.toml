[package]
name = "rbit-git"
description = "Git repository storage and read model for rbit, built on gitoxide."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# One integration-test binary (tests/main.rs) instead of one per file.
autotests = false

[dependencies]
rbit-core.workspace = true
gix = { workspace = true, features = ["blame"] }
similar.workspace = true
sha2.workspace = true
async-compression.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
