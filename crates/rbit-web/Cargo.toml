[package]
name = "rbit-web"
description = "The rbit web application: Axum routes, Askama templates, HTMX, and embedded assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# One integration-test binary (tests/main.rs) instead of one per file.
autotests = false

[features]
default = ["actions", "i18n"]
actions = ["rbit-services/actions", "dep:rbit-workflow"]

i18n = ["rbit-services/i18n", "dep:rbit-i18n-web"]

[dependencies]
rbit-i18n-web = { workspace = true, optional = true }
rbit-ui.workspace = true
rbit-messages.workspace = true
rbit-plugin-api.workspace = true
rbit-plugin-packages.workspace = true
rbit-plugin-runtime.workspace = true
http-body = "1"
rbit-core.workspace = true
rbit-auth.workspace = true
rbit-git.workspace = true
rbit-services = { workspace = true, default-features = false }
rbit-transport.workspace = true

axum = { workspace = true, features = ["multipart"] }
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io-util"] }
futures-util.workspace = true
async-compression.workspace = true
brotli.workspace = true

askama.workspace = true
askama_web.workspace = true
pulldown-cmark.workspace = true
ammonia.workspace = true
syntect.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
qrcode.workspace = true

base64.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
# Actions: S. The runner protocol's wire types, and gzip bodies within a decompressed cap.
rbit-workflow = { workspace = true, optional = true }
flate2.workspace = true

[dev-dependencies]
# Deterministic HTTP waiter-drop regression against a real SQLite writer barrier.
sqlx.workspace = true
proptest.workspace = true
# Actions (F): the query counter shared with rbit-storage's tests.
tracing-subscriber.workspace = true
rbit-storage.workspace = true
tempfile.workspace = true
# Actions: artifacts as the runner stores them, and the zip archives they download as.
tar.workspace = true
zip.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# The HTTP eval of Actions' authorization and protocol rules (see tests/actions_eval.rs).
[[test]]
name = "actions_eval"
path = "tests/actions_eval.rs"
required-features = ["actions"]
