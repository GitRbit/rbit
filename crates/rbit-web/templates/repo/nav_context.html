{% import "macros.html" as ui %}
{#- `owner / repo` breadcrumb in the top bar; expects a `header: RepoHeader` field. On phones
    the repository tabs show the name instead (repo/subnav.html). -#}
<span class="hidden min-w-0 items-center gap-2 md:flex">
  <span class="text-ink-faint">/</span>
  <a href="/{{ header.owner }}" class="truncate text-ink-muted hover:text-ink">{{ header.owner }}</a>
  <span class="text-ink-faint">/</span>
  <a href="{{ header.home_url }}" class="truncate font-medium">{{ header.name }}</a>
  {% if header.is_private %}<span class="badge">Private</span>{% endif %}
</span>
