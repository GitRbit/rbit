<div class="max-w-xl">
  <p class="text-[13px] text-ink-muted">{{ messages.text("core", "locale-description") }}</p>
  {% if let Some(error) = error %}<p class="mt-4 text-[13px]" role="alert">{{ error }}</p>{% endif %}
  {% if let Some(form) = form %}
  <form method="post" action="{{ form.action() }}" hx-boost="false" class="mt-6 space-y-4">
    <input type="hidden" name="_csrf" value="{{ form.csrf() }}">
    <label class="block text-[13px]" for="locale">{{ messages.text("core", "locale-title") }}</label>
    <select id="locale" name="locale" class="input w-full">
      <option value="">{{ messages.text("core", "locale-automatic") }}</option>
      {% for locale in locales %}<option value="{{ locale }}"{% if locale.as_str() == selected.as_str() %} selected{% endif %}>{{ locale }}</option>{% endfor %}
    </select>
    <button class="btn btn-primary" type="submit">{{ messages.text("core", "locale-save") }}</button>
  </form>
  {% endif %}
</div>
