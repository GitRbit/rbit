{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="text-2xl font-semibold tracking-tight">{{ crate::i18n::text("core", "locale-title") }}</h1>
  <p class="mt-2 text-[13px] text-ink-muted">{{ crate::i18n::text("core", "locale-description") }}</p>
  <form method="post" action="/language" hx-boost="false" class="mt-6 space-y-4">
    <label class="block text-[13px]" for="locale">{{ crate::i18n::text("core", "locale-title") }}</label>
    <select id="locale" name="locale" class="input w-full">
      <option value="">{{ crate::i18n::text("core", "locale-automatic") }}</option>
      {% for locale in locales %}<option value="{{ locale }}"{% if locale.as_str() == selected.as_str() %} selected{% endif %}>{{ locale }}</option>{% endfor %}
    </select>
    <button class="btn btn-primary" type="submit">{{ crate::i18n::text("core", "locale-save") }}</button>
  </form>
</div>
{% endblock %}
