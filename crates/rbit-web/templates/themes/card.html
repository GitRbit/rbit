{#- One live preview card; `card` is a views::themes::ThemeCard. The card carries the theme, so everything inside renders in its colours. -#}
<li class="theme-item" data-theme-item data-variant="{{ card.variant }}"{% if card.hidden %} hidden{% endif %}><button class="theme-card" type="submit" name="theme" data-theme="{{ card.slug }}" value="{{ card.slug }}" data-counterpart="{{ card.counterpart }}" aria-pressed="{{ card.is_current }}" title="{{ card.credit }}"><span class="tp" aria-hidden="true"><span class="tp-box"><i class="tp-h"></i><i class="tp-a"></i><i class="tp-b"></i></span><i class="tp-sw"></i></span><span class="theme-name">{{ card.name }}</span></button></li>
