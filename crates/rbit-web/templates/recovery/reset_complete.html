{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block content %}
<section class="auth-shell">
  <header class="auth-head">
    <span class="tile text-success">{% call ui::icon("check", "size-5") %}{% endcall %}</span>
    <h1 class="auth-title">Password changed</h1>
  </header>

  <div class="card">
    <p class="text-[13px] text-ink-muted">Your new password is set. Use it the next time you sign in.</p>
    <a href="/login" class="btn btn-primary btn-lg mt-6 w-full">Sign in</a>
  </div>
</section>
{% endblock %}
