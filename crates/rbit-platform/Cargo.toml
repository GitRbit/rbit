[package]
name = "rbit-platform"
description = "Owned filesystem primitives with an isolated reviewed Windows native boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
getrandom.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true

# Reviewed platform exception: only src/windows/native.rs may allow this deny.
# Every other workspace lint is retained; scripts/rewrite/platform-boundary.mjs
# compares these sections to the root policy and rejects additional exceptions.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
