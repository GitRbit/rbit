name: Release

# Pushing a tag `vX.Y.Z` publishes rbit X.Y.Z:
#   1. checks that the tag matches the workspace version and that CHANGELOG.md has a
#      `## [X.Y.Z]` section (its text becomes the release notes);
#   2. builds the stylesheet once, then release binaries for Linux (x86_64, aarch64),
#      macOS (x86_64, aarch64) and Windows (x86_64), each natively or with the platform's
#      own cross toolchain — no emulation, no Docker-based cross compilers;
#   3. creates the GitHub release with the archives and their SHA-256 sums;
#   4. pushes a multi-architecture image (linux/amd64, linux/arm64) of the same Linux
#      binaries to ghcr.io/gitrbit/rbit, and one of rbit-runner to
#      ghcr.io/gitrbit/rbit-runner. Every archive holds both rbit and rbit-runner.
#
# A tag with a pre-release suffix (`v0.2.0-rc.1`) makes a pre-release; it may use the
# `## [Unreleased]` section when the version has none yet, and never moves `latest`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never run two releases of the same tag at once, and never cancel one half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  NODE_VERSION: "24"
  IMAGE: ghcr.io/gitrbit/rbit
  RUNNER_IMAGE: ghcr.io/gitrbit/rbit-runner

jobs:
  prepare:
    name: Check version and notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          successful_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs | length')"
          if [[ "$successful_runs" -eq 0 ]]; then
            echo "::error::The tagged commit must have a successful push CI run on main before release."
            exit 1
          fi
      - name: Compare the tag with the workspace version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rbit-server") | .version')"
          if [[ "$version" != "$crate" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate (Cargo.toml)"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Extract the release notes from CHANGELOG.md
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Print the body of the `## [<heading>]` section, up to the next `## [` heading.
          section() {
            awk -v heading="## [$1]" '
              index($0, "## [") == 1 { if (found) exit; found = (index($0, heading) == 1); next }
              found { print }
            ' CHANGELOG.md
          }
          section "$VERSION" > notes.md
          if [[ ! -s notes.md && "$PRERELEASE" == true ]]; then
            section "Unreleased" > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with content"
            exit 1
          fi
          echo "Release notes:"; cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

  assets:
    name: Stylesheet
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The stylesheet is embedded into the binary at compile time, so it is built first.
      - run: npm ci
      - run: npm run build
      # Vendored scripts are committed; a release must ship exactly what is in the tag.
      - run: git diff --exit-code -- crates/rbit-web/assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-css
          path: crates/rbit-web/assets/app.css
          retention-days: 7

  binaries:
    name: Build ${{ matrix.target }}
    needs: [prepare, assets]
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc builds on the oldest supported Ubuntu runners (glibc 2.35), so they also
          # run on Debian 12, Ubuntu 22.04 and newer. aarch64 builds natively on an Arm
          # runner, so SQLite, ring and mimalloc need no cross C toolchain.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
          # Apple's toolchain builds both architectures on an Apple silicon runner.
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      NAME: rbit-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-css
          path: crates/rbit-web/assets
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --package rbit-server --package rbit-runner --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/rbit --version
          ./target/${{ matrix.target }}/release/rbit-runner --version
      - name: Package
        shell: bash
        run: |
          suffix=""
          [[ "${{ matrix.target }}" == *windows* ]] && suffix=.exe
          mkdir -p "dist/$NAME"
          # rbit-runner ships next to rbit: the forge and the runner that builds for it.
          for exe in rbit rbit-runner; do
            cp "target/${{ matrix.target }}/release/$exe$suffix" "dist/$NAME/"
          done
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY.md "dist/$NAME/"
          cp deploy/rbit.example.toml deploy/rbit.service deploy/rbit-runner.example.toml deploy/rbit-runner.service "dist/$NAME/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ env.NAME }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub release
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rbit ${TAG#v}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"

  image:
    name: Publish the container image
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*-linux-gnu
          path: archives
          merge-multiple: true
      # The Dockerfile's `prebuilt` stage takes dist/linux-<arch>/rbit (tar keeps the
      # executable bit that artifacts would lose).
      - name: Unpack the Linux binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}" target="${pair#*:}"
            mkdir -p "dist/linux-$arch"
            tar -xzf "archives/rbit-$VERSION-$target.tar.gz" --strip-components=1 \
              -C "dist/linux-$arch" "rbit-$VERSION-$target/rbit"
          done
          ls -lR dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` and the X.Y / X tags only for final releases (the semver patterns skip
          # pre-releases on their own); `{{version}}` always.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          # GitHub reports a dual license as "NOASSERTION"; state it explicitly.
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.title=rbit
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

  runner-image:
    name: Publish the runner image
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*-linux-gnu
          path: archives
          merge-multiple: true
      # Dockerfile.runner's `prebuilt` stage takes dist/linux-<arch>/rbit-runner.
      - name: Unpack the Linux runners
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch="${pair%%:*}" target="${pair#*:}"
            mkdir -p "dist/linux-$arch"
            tar -xzf "archives/rbit-$VERSION-$target.tar.gz" --strip-components=1               -C "dist/linux-$arch" "rbit-$VERSION-$target/rbit-runner"
          done
          ls -lR dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.RUNNER_IMAGE }}
          # The same tags as the rbit image: a runner and a forge of one release go together.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.title=rbit-runner
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
