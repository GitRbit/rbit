name: Repository health

on:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Public configuration and dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm run audit:repository
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check licenses advisories
      - run: npm audit --audit-level=high
