name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks. Runs on `main` are
# never cancelled, so every commit that lands there gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "24"

jobs:
  core-only:
    name: Core-only server
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-css
          path: crates/rbit-web/assets
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: core-only
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: node scripts/check-core-dependencies.mjs
      - run: cargo clippy --locked --package rbit-server --package rbit-services --package rbit-web --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --package rbit-services --no-default-features --test integration actions_unavailable
      - run: cargo test --locked --package rbit-services --no-default-features --test integration i18n_unavailable
      - run: cargo test --locked --package rbit-web --no-default-features --test integration runtime_ui_registration

  plugin-profiles:
    name: Optional plugin (${{ matrix.plugin }})
    needs: assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [actions, i18n]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-css
          path: crates/rbit-web/assets
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: plugin-${{ matrix.plugin }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-core-dependencies.mjs ${{ matrix.plugin }}
      - run: cargo clippy --locked -p rbit-server -p rbit-services -p rbit-web --no-default-features --features ${{ matrix.plugin }} --all-targets -- -D warnings
      - run: cargo test --locked -p rbit-services --no-default-features --features ${{ matrix.plugin }} --test integration i18n_

  plugin-core:
    name: Plugin core contracts and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: plugin-core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # These contracts and lifecycle primitives must build without forge assets, a
      # database, or the web application. The full workspace jobs still run below.
      - run: cargo test --locked -p rbit-actions-core -p rbit-plugin-api -p rbit-plugin-runtime -p rbit-plugin-web -p rbit-messages -p rbit-i18n

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves caches; pull requests restore them. Saving per pull request fills
          # the repository cache limit and evicts the main caches every run depends on.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # Pedantic lints are enabled workspace-wide in Cargo.toml; warnings fail the build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A prebuilt cargo-deny binary: compiling it would take longer than the check.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny
      # deny.toml lists the allowed licenses and the ignored advisories (each with a reason).
      # Advisories come from the RustSec database, so a new advisory can fail an unchanged
      # commit: that is the point.
      - run: cargo deny --locked check licenses advisories

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the supported server platform; Windows keeps local development honest.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Integration tests drive the real git CLI (pushes, gc, backups); the hosted runners
      # ship git, so only print its version for the log.
      - run: git --version
      # Asset tests need the generated (gitignored) stylesheet embedded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci && npm run build
      # nextest runs every test binary in parallel, each test in its own process. The
      # workspace has no doctests, which nextest does not run.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci

  assets:
    name: Front-end build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/check-messages.mjs
      - run: python3 scripts/build-language-packs.py --check
      # Vendored scripts and generated icons are committed; the build must not change them.
      - run: git diff --exit-code -- crates/rbit-web/assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-css
          path: crates/rbit-web/assets/app.css
          retention-days: 1

  release:
    name: Release build
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-css
          path: crates/rbit-web/assets
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rbit-runner is not a default member: name both, as the release does.
      - run: cargo build --release --locked --package rbit-server --package rbit-runner
      - run: ./target/release/rbit --version
      - run: ./target/release/rbit-runner --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rbit-linux-x86_64
          path: |
            target/release/rbit
            target/release/rbit-runner
          retention-days: 7

  runner-image:
    name: Runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The image the release publishes, compiled from source: its packages must install
      # and the runner must start inside it.
      - run: docker build --file Dockerfile.runner --tag rbit-runner:ci .
      - run: docker run --rm rbit-runner:ci --version
      - run: docker run --rm --entrypoint git rbit-runner:ci --version
      - run: docker run --rm --entrypoint docker rbit-runner:ci --version
