name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks. Runs on `main` are
# never cancelled, so every commit that lands there gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24"

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Pedantic lints are enabled workspace-wide in Cargo.toml; warnings fail the build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the supported server platform; Windows keeps local development honest.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Integration tests drive the real git CLI (pushes, gc, backups); the hosted runners
      # ship git, so only print its version for the log.
      - run: git --version
      - run: cargo test --workspace --locked

  assets:
    name: Front-end build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Vendored scripts and generated icons are committed; the build must not change them.
      - run: git diff --exit-code -- crates/rustit-web/assets
      - uses: actions/upload-artifact@v7
        with:
          name: app-css
          path: crates/rustit-web/assets/app.css
          retention-days: 1

  release:
    name: Release build
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app-css
          path: crates/rustit-web/assets
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release --locked --package rustit-server
      - run: ./target/release/rustit --version
      - uses: actions/upload-artifact@v7
        with:
          name: rustit-linux-x86_64
          path: target/release/rustit
          retention-days: 7
