name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks. Runs on `main` are
# never cancelled, so every commit that lands there gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NODE_VERSION: "24"

jobs:
  rewrite-contracts:
    name: Rewrite contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Bootstrap registry sources before guarded compilation's offline metadata scan.
      - run: node scripts/workspace.mjs fetch --locked
      - run: node --test scripts/tests/rewrite-*.test.mjs scripts/tests/identity-features.test.mjs scripts/tests/workspace*.test.mjs
      - run: node scripts/rewrite/check.mjs
      # Separate invocations prevent workspace feature unification from hiding a
      # missing model-only or credentials-only dependency/compile contract.
      - run: node scripts/workspace.mjs test --package rbit-identity --no-default-features --locked
      - run: node scripts/workspace.mjs test --package rbit-identity-models --no-default-features --locked
      - run: node scripts/workspace.mjs test --package rbit-identity --no-default-features --features credentials --locked
      # The workspace test union enables identity password-work; compile this tool
      # separately so an accidental application-only import cannot be hidden by it.
      - run: node scripts/workspace.mjs test --package rbit-credential-inventory --no-default-features --locked
      - run: node scripts/workspace.mjs test --package rbit-identity --no-default-features --features session-tokens --locked
      - run: node scripts/workspace.mjs test --package rbit-identity --no-default-features --features sessions --locked
      - run: node scripts/workspace.mjs test --package rbit-collaboration --no-default-features --locked
      - run: node scripts/workspace.mjs test --package rbit-collaboration --no-default-features --features applications --locked
      - run: node scripts/workspace.mjs test --package rbit-contracts --package rbit-core --package rbit-repositories --package rbit-kernel --package rbit-localization --package rbit-identity-models --package rbit-identity --package rbit-collaboration --package rbit-auth --package rbit-rewrite-check --features rbit-identity/password-work,rbit-identity/sessions,rbit-collaboration/applications --locked
      - run: node scripts/workspace.mjs test --package rbit-render-probe --no-default-features --features inheritance,segments,blocks,count-8 --locked
      - run: node scripts/rewrite/check-types.mjs

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> .cargo-build"
          # PR saves stay in their merge-ref scope; main cannot restore them.
          # Save dependency outputs only; keep local workspace units and tools out.
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: >-
            ${{ (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge')) ||
                (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
      - run: cargo fmt --all --check
      # Pedantic lints are enabled workspace-wide in Cargo.toml; warnings fail the build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A prebuilt cargo-deny binary: compiling it would take longer than the check.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-deny
      # deny.toml lists the allowed licenses and the ignored advisories (each with a reason).
      # Advisories come from the RustSec database, so a new advisory can fail an unchanged
      # commit: that is the point.
      - run: cargo deny --locked check licenses advisories

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the supported server platform; Windows keeps local development honest.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> .cargo-build"
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: >-
            ${{ (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge')) ||
                (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
      # Integration tests drive the real git CLI (pushes, gc, backups); the hosted runners
      # ship git, so only print its version for the log.
      - run: git --version
      # Asset tests need the generated (gitignored) stylesheet embedded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci && npm run build
      # nextest runs test binaries in parallel; Rust documentation examples need
      # their own command because nextest does not execute doctests.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --doc --locked
      - name: Check production visual source relevance (Linux only)
        if: runner.os == 'Linux'
        id: production-visual
        run: node devtools/actions-visual/production-relevance.mjs
      - name: Export the existing exact web test binary and public assets
        if: runner.os == 'Linux' && steps.production-visual.outputs.run != 'false'
        run: node devtools/actions-visual/export-production.mjs
      - name: Hand off public production fixture inputs (no seeded runtime state)
        if: runner.os == 'Linux' && steps.production-visual.outputs.run != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: actions-production-fixture
          path: actions-production-fixture/
          if-no-files-found: error
          retention-days: 1

  actions-production-visual:
    name: Sandboxed production Actions candidates (optional)
    # Reuse the existing binary. This intentionally waits for both test platforms.
    # The seven required checks remain unchanged; failures here still fail this workflow.
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check exact source event delta (unknown means run)
        id: delta
        run: node devtools/actions-visual/production-relevance.mjs
      - name: Download same-workflow public fixture inputs
        if: steps.delta.outputs.run != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: actions-production-fixture
          path: actions-production-fixture
      - name: Verify source contracts and install exact isolated tooling
        if: steps.delta.outputs.run != 'false'
        run: |
          node --test scripts/tests/rewrite-actions-production*.test.mjs
          npm ci --ignore-scripts --prefix devtools/actions-visual
          npm audit --prefix devtools/actions-visual --audit-level=high
      - name: Capture real production pages with positive sandbox proof
        if: steps.delta.outputs.run != 'false'
        run: node devtools/actions-visual/container.mjs --production
      - name: Remove only the positively owned production container
        if: ${{ always() }}
        run: node devtools/actions-visual/cleanup.mjs --production
      - name: Verify bounded public image evidence
        id: artifacts
        if: ${{ always() && !cancelled() && steps.delta.outputs.run != 'false' }}
        run: node devtools/actions-visual/artifacts.mjs actions-production-artifacts
      - name: Retain production candidates and sanitized evidence
        if: ${{ always() && !cancelled() && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: actions-production-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-production-artifacts/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Explain production acceptance scope
        if: ${{ always() && !cancelled() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Production Actions candidates
          Debug-functional pages reuse the existing Linux test binary and exact public assets.
          Human image review and successful real HTMX checks are required; this is not release timing.
          The job waits for both test platforms and inherits this workflow's PR supersession cancellation.
          No seeded data, cookies, profiles or private process output are uploaded.
          SUMMARY

  assets:
    name: Front-end build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Vendored scripts and generated icons are committed; the build must not change them.
      - run: git diff --exit-code -- crates/rbit-web/assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-css
          path: crates/rbit-web/assets/app.css
          retention-days: 1

  release:
    name: Release build
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-css
          path: crates/rbit-web/assets
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> .cargo-build"
          key: release
          cache-workspace-crates: false
          cache-all-crates: false
          cache-bin: false
          cache-on-failure: false
          save-if: >-
            ${{ (github.event_name == 'pull_request' && startsWith(github.ref, 'refs/pull/') && endsWith(github.ref, '/merge')) ||
                (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
      # rbit-runner is not a default member: name both, as the release does.
      - run: cargo build --release --locked --package rbit-server --package rbit-runner
      - run: ./target/release/rbit --version
      - run: ./target/release/rbit-runner --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rbit-linux-x86_64
          path: |
            target/release/rbit
            target/release/rbit-runner
          retention-days: 7

  runner-image:
    name: Runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The image the release publishes, compiled from source: its packages must install
      # and the runner must start inside it.
      - run: docker build --file Dockerfile.runner --tag rbit-runner:ci .
      - run: docker run --rm rbit-runner:ci --version
      - run: docker run --rm --entrypoint git rbit-runner:ci --version
      - run: docker run --rm --entrypoint docker rbit-runner:ci --version

  required:
    # Keep this display name stable for branch protection. Every required validation
    # is listed directly, including ancestors, so no skip hides failure. Candidate
    # image review remains a separate optional check until its acceptance gate passes.
    name: CI required
    if: ${{ always() }}
    needs: [rewrite-contracts, lint, deny, test, assets, release, runner-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Summarize and require every validation
        run: node scripts/ci/required-check.mjs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
