# cargo-nextest: `cargo nextest run --workspace` runs every test binary in parallel, each
# test in its own process. CI uses the `ci` profile.

[profile.ci]
# Fail hung tests after five minutes; retries remain disabled by default.
slow-timeout = { period = "60s", terminate-after = 5 }
# Report every failing test in one run instead of stopping at the first.
fail-fast = false

[profile.ci.junit]
# CI shards read this report (target/nextest/ci/junit.xml) to record which tests failed,
# so a re-run of a failed shard can run only those tests. See docs/ci-test-shards.md.
path = "junit.xml"
